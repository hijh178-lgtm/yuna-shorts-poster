name: token-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,15 * *"
permissions:
  contents: read
jobs:
  refresh:
    if: ${{ vars.ACCOUNT_CONNECTED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - run: python scripts/refresh.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
